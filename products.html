<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=cooking" />
 <link rel="stylesheet" href="./product.css">
</head>


<body>

    <!-- Products Section -->
   <!-- Products Section -->
<section class="py-5" id="product">

    <div class="container">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h1 id="categoryTitle" class="display-5 fw-bold">
                Rental Items
            </h1>
        </div>

        <!-- Search -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-6">
                <input
                    type="search"
                    id="searchInput"
                    class="form-control form-control-lg"
                    placeholder="Search rental items..."
                >
            </div>
        </div>

        <!-- Products -->
        <div id="productContainer" class="row g-4">
            <!-- Products will be inserted here -->
        </div>

        <!-- No Products -->
        <div id="noProducts" class="text-center d-none">
            <i class="bi bi-box-seam display-1 text-muted"></i>

            <h3 class="mt-3">
                No products found
            </h3>

            <p class="text-muted">
                No rental items are available in this category.
            </p>
        </div>

    </div>

</section>



 <script src="./Products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
       
</body>

</html>
